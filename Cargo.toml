[workspace]
members = [
    "crates/sadtalker-core",
    "crates/sadtalker-cli",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["SadTalker Contributors", "Brandon Hubbard <bhubbard@users.noreply.github.com>"]
license = "MIT"
repository = "https://github.com/bhubbard/sadtalker-rs"
homepage = "https://github.com/bhubbard/sadtalker-rs"
documentation = "https://github.com/bhubbard/sadtalker-rs#readme"
readme = "README.md"
keywords = ["sadtalker", "talking-head", "face-animation", "audio-driven", "rust"]
categories = ["multimedia::video", "science", "command-line-utilities"]

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
clap = { version = "4.5", features = ["derive", "env"] }
anyhow = "1.0"
thiserror = "1.0"
colored = "2.1"
safetensors = "0.4"
hound = "3.5"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
tempfile = "3.12"
indicatif = "0.17"
byteorder = "1.5"
